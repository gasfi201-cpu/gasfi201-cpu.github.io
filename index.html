<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Water Clicker 🫧</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0b0f1c;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s;
        }
        .container {
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(8px);
            padding: 25px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(116, 185, 255, 0.3);
            max-width: 550px;
            width: 100%;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }
        .settings-btn:hover {
            color: #74b9ff;
            transform: rotate(60deg);
        }

        .settings-menu {
            position: absolute;
            top: 55px;
            right: 20px;
            background: #1a1f33;
            border: 1px solid #2a2f4a;
            border-radius: 16px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            min-width: 140px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .settings-menu.open {
            display: flex;
        }
        .settings-menu .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            background: #2a2f4a;
            color: white;
        }
        .settings-menu .btn-danger {
            background: #533483;
        }
        .settings-menu .btn-danger:hover {
            background: #6a46a0;
        }

        h1 {
            color: #74b9ff;
            font-size: 32px;
            text-shadow: 0 0 30px rgba(116, 185, 255, 0.4);
            letter-spacing: 2px;
        }
        h1 span {
            color: #e94560;
        }
        .sub {
            color: #8888aa;
            font-size: 13px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .auth-section {
            background: #0f1424;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(116, 185, 255, 0.15);
        }
        .auth-section input {
            background: #1a1f33;
            border: 1px solid #2a2f4a;
            color: #eee;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 15px;
            width: 100%;
            max-width: 220px;
            margin: 5px;
            outline: none;
        }
        .auth-section input:focus {
            border-color: #74b9ff;
        }
        .auth-section .btn-sm {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            background: #74b9ff;
            color: #0b0f1c;
            margin: 5px;
        }
        .auth-section .btn-sm:hover {
            background: #8fc9ff;
        }
        .auth-section .username-display {
            color: #74b9ff;
            font-weight: 700;
            font-size: 18px;
        }

        .score-block {
            background: #0f1424;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(116, 185, 255, 0.1);
        }
        #counterDisplay {
            font-size: 72px;
            font-weight: 900;
            color: #74b9ff;
            line-height: 1;
            transition: 0.15s;
            text-shadow: 0 0 30px rgba(116, 185, 255, 0.2);
        }
        .progress-wrap {
            background: #0b0f1c;
            border-radius: 40px;
            height: 12px;
            margin: 15px 0 5px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #74b9ff, #1dd1a1);
            border-radius: 40px;
            transition: width 0.2s ease;
        }
        .target-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666688;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
        }
        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #2a2f4a;
            color: white;
            flex: 1 0 auto;
            min-width: 80px;
            box-shadow: 0 4px 0 #0f1424;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0f1424;
        }
        .btn-primary {
            background: #74b9ff;
            color: #0b0f1c;
            box-shadow: 0 4px 0 #4a8fc7;
        }
        .btn-primary:hover {
            background: #8fc9ff;
        }
        .btn-success {
            background: #1dd1a1;
            color: #0b0f1c;
            box-shadow: 0 4px 0 #0f8b6e;
        }
        .btn-success:hover {
            background: #30e5b5;
        }
        .btn-danger {
            background: #533483;
            box-shadow: 0 4px 0 #3a255a;
        }
        .btn-danger:hover {
            background: #6a46a0;
        }
        .btn-warning {
            background: #f39c12;
            color: #0b0f1c;
            box-shadow: 0 4px 0 #b06d0b;
        }
        .btn-warning:hover {
            background: #fdcb6e;
        }
        .btn-purple {
            background: #6c5ce7;
            box-shadow: 0 4px 0 #4a3a9e;
        }
        .btn-purple:hover {
            background: #7d6ff0;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
            font-size: 13px;
            color: #8888aa;
        }
        .stat-grid span {
            color: #eee;
            font-weight: 700;
        }
        .shop-item {
            background: #0f1424;
            border-radius: 16px;
            padding: 10px 15px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .shop-item .info {
            text-align: left;
            font-size: 14px;
        }
        .shop-item .info .name {
            font-weight: 700;
            color: #fff;
        }
        .shop-item .info .desc {
            color: #8888aa;
            font-size: 12px;
        }
        .shop-item .price {
            color: #fdcb6e;
            font-weight: 700;
        }
        .shop-item .btn-sm {
            padding: 6px 14px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            background: #74b9ff;
            color: #0b0f1c;
        }
        .shop-item .btn-sm:hover {
            background: #8fc9ff;
        }
        .float-text {
            position: fixed;
            pointer-events: none;
            font-weight: 900;
            font-size: 28px;
            color: #74b9ff;
            text-shadow: 0 0 20px #74b9ff, 0 0 40px #0984e3;
            z-index: 999;
            animation: floatUp 0.9s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(1.5);
            }
        }
        .water-ripple {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            border: 2px solid rgba(116, 185, 255, 0.5);
            animation: rippleOut 0.6s ease-out forwards;
            z-index: 998;
        }
        @keyframes rippleOut {
            0% {
                width: 10px;
                height: 10px;
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                width: 120px;
                height: 120px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }
        footer {
            margin-top: 15px;
            font-size: 12px;
            color: #444466;
        }
        .click-effect {
            animation: pop 0.15s ease;
        }
        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
                color: #fff;
            }
            100% {
                transform: scale(1);
            }
        }
        .prestige-badge {
            background: #74b9ff;
            color: #0b0f1c;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-top: 5px;
        }
        .hidden {
            display: none !important;
        }
        .text-success {
            color: #1dd1a1;
        }
        .text-error {
            color: #e94560;
        }
        .leaderboard-section {
            background: #0f1424;
            border-radius: 20px;
            padding: 12px 15px;
            margin-top: 12px;
            border: 1px solid rgba(116, 185, 255, 0.1);
            max-height: 200px;
            overflow-y: auto;
        }
        .leaderboard-section h3 {
            color: #8888aa;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .lb-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px solid #1a1f33;
            color: #ccc;
        }
        .lb-row .lb-rank {
            color: #fdcb6e;
            font-weight: 700;
            width: 40px;
            text-align: left;
        }
        .lb-row .lb-name {
            flex: 1;
            text-align: left;
        }
        .lb-row .lb-score {
            color: #74b9ff;
            font-weight: 700;
        }
        .lb-row.me {
            background: #1a2a3a;
            border-radius: 8px;
            padding: 4px 8px;
        }
        .lb-row.me .lb-name {
            color: #74b9ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ШЕСТЕРЁНКА -->
        <button class="settings-btn" id="settingsToggle">⚙️</button>

        <!-- ВЫПАДАЮЩЕЕ МЕНЮ -->
        <div class="settings-menu" id="settingsMenu">
            <button class="btn btn-danger" id="resetBtn">🔄 Сброс прогресса</button>
        </div>

        <h1>🫧 <span>Water</span> Clicker</h1>
        <div class="sub">~ капни на кнопку и собирай очки ~</div>

        <!-- АВТОРИЗАЦИЯ -->
        <div class="auth-section" id="authSection">
            <div id="authForms">
                <input type="text" id="usernameInput" placeholder="Введи свой ник">
                <button class="btn-sm" id="startBtn">Начать игру</button>
            </div>
            <div id="userInfo" class="hidden">
                <span class="username-display" id="usernameDisplay">Игрок</span>
                <button class="btn-sm" id="logoutBtn" style="margin-left:10px;background:transparent;border:1px solid #74b9ff;color:#74b9ff;">Сменить ник</button>
            </div>
            <div id="authMessage" style="font-size:13px;margin-top:6px;color:#8888aa;"></div>
        </div>

        <!-- ИГРА -->
        <div id="gameBlock" class="hidden">
            <div class="score-block">
                <div id="counterDisplay">0</div>
                <div class="progress-wrap"><div id="progressFill"></div></div>
                <div class="target-info">
                    <span>🎯 Цель: <span id="targetLabel">100</span></span>
                    <span id="progressPercent">0%</span>
                    <span>🔥 Комбо: <span id="comboCount">0</span></span>
                </div>
                <div id="prestigeDisplay"></div>
            </div>

            <div class="stat-grid">
                <div>💧 Капель: <span id="statClicks">0</span></div>
                <div>💪 Сила: <span id="statPerClick">1</span></div>
                <div>🌟 Престиж: <span id="statPrestige">0</span></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="clickBtn">💧 КАПНУТЬ!</button>
                <button class="btn btn-success" id="autoBtn">▶ АВТО</button>
                <button class="btn btn-warning" id="bgBtn">🎨 ФОН</button>
            </div>
            <div class="btn-group">
                <button class="btn" id="targetBtn" style="background:#2d3a5a;">🎯 ЦЕЛЬ +50</button>
                <button class="btn btn-purple" id="prestigeBtn">🌟 ПРЕСТИЖ</button>
            </div>

            <div style="margin:15px 0;">
                <div class="shop-item">
                    <div class="info"><span class="name">💧 Усиление капли</span><div class="desc">+1 к силе клика</div></div>
                    <div><span class="price" id="priceClick">10</span> <button class="btn-sm" id="buyClick">Купить</button></div>
                </div>
                <div class="shop-item">
                    <div class="info"><span class="name">🌊 Авто-поток</span><div class="desc">+1 к автокликеру</div></div>
                    <div><span class="price" id="priceAuto">20</span> <button class="btn-sm" id="buyAuto">Купить</button></div>
                </div>
            </div>
        </div>

        <!-- ТАБЛИЦА ЛИДЕРОВ -->
        <div class="leaderboard-section" id="leaderboardSection">
            <h3>🏆 Топ игроков</h3>
            <div id="leaderboardList">
                <div style="color:#666;font-size:13px;">Загрузка...</div>
            </div>
        </div>

        <footer>
            💾 <span id="saveStatus">Автосохранение включено</span>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script>
        // ============================================================
        // 1. SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://cduuglluvucwwgxpepdv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkdXVnbGx1dnVjd3dneHBlcGR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODE4OTYsImV4cCI6MjEwMDc1Nzg5Nn0.NtFs0mzasUuGVfa7qWwWYLXIXAY5c0hbq3yqayFx5L8';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 2. СОСТОЯНИЕ
        // ============================================================
        let state = {
            score: 0,
            totalClicks: 0,
            target: 100,
            clickPower: 1,
            autoPower: 1,
            prestigeLevel: 0,
            highScore: 0
        };

        let autoInterval = null;
        let isAutoRunning = false;
        let priceClick = 10;
        let priceAuto = 20;
        let comboCount = 0;
        let comboTimer = null;
        let currentUsername = null;

        // ============================================================
        // 3. АВТОРИЗАЦИЯ
        // ============================================================
        function showAuthMessage(text, type = 'info') {
            const el = document.getElementById('authMessage');
            el.textContent = text;
            el.className = type === 'error' ? 'text-error' : 'text-success';
        }

        function startGame() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username || username.length < 2) {
                showAuthMessage('Введи ник (минимум 2 символа)', 'error');
                return;
            }

            currentUsername = username;
            document.getElementById('usernameDisplay').textContent = username;
            document.getElementById('authForms').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('gameBlock').classList.remove('hidden');

            showAuthMessage('Добро пожаловать, ' + username + '!', 'success');
            loadGame();
            loadLeaderboard();
        }

        function logoutUser() {
            currentUsername = null;
            document.getElementById('gameBlock').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('authForms').classList.remove('hidden');
            showAuthMessage('Вы вышли', 'success');
        }

        // ============================================================
        // 4. ТАБЛИЦА ЛИДЕРОВ
        // ============================================================
        async function loadLeaderboard() {
            const { data, error } = await supabase
                .from('scores')
                .select('username, score, prestige_level')
                .order('score', { ascending: false })
                .limit(20);

            if (error) { console.error(error); return; }

            const list = document.getElementById('leaderboardList');
            if (!data || data.length === 0) {
                list.innerHTML = '<div style="color:#666;font-size:13px;">Пока нет рекордов. Будь первым!</div>';
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const name = item.username || 'Аноним';
                const isMe = name === currentUsername;
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                html += `<div class="lb-row ${isMe ? 'me' : ''}">
                            <span class="lb-rank">${medal}</span>
                            <span class="lb-name">${name}</span>
                            <span class="lb-score">${item.score}</span>
                        </div>`;
            });
            list.innerHTML = html;
        }

        async function saveScoreToLeaderboard() {
            if (!currentUsername) return;
            const { error } = await supabase
                .from('scores')
                .upsert({
                    username: currentUsername,
                    score: state.score,
                    prestige_level: state.prestigeLevel
                }, { onConflict: 'username' });

            if (error) console.error('Ошибка сохранения рекорда:', error);
            else {
                loadLeaderboard();
            }
        }

        // ============================================================
        // 5. ИГРОВАЯ МЕХАНИКА
        // ============================================================
        function loadGame() {
            const saved = localStorage.getItem('waterClickerSave_' + currentUsername);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    state.score = data.score || 0;
                    state.totalClicks = data.totalClicks || 0;
                    state.target = data.target || 100;
                    state.clickPower = data.clickPower || 1;
                    state.autoPower = data.autoPower || 1;
                    state.prestigeLevel = data.prestigeLevel || 0;
                    state.highScore = data.highScore || 0;
                    priceClick = data.priceClick || 10;
                    priceAuto = data.priceAuto || 20;
                } catch (e) {}
            }
            updateUI();
        }

        function saveGame() {
            if (!currentUsername) return;
            const data = {
                score: state.score,
                totalClicks: state.totalClicks,
                target: state.target,
                clickPower: state.clickPower,
                autoPower: state.autoPower,
                prestigeLevel: state.prestigeLevel,
                highScore: state.highScore,
                priceClick: priceClick,
                priceAuto: priceAuto
            };
            localStorage.setItem('waterClickerSave_' + currentUsername, JSON.stringify(data));
            saveScoreToLeaderboard();
        }

        // ============================================================
        // 6. ЗВУК
        // ============================================================
        function playWaterDrop(volume = 0.2) {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(400 + Math.random() * 200, now);
                osc1.frequency.exponentialRampToValueAtTime(200 + Math.random() * 100, now + 0.12);
                gain1.gain.setValueAtTime(volume * 0.6, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1200 + Math.random() * 300, now);
                osc2.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain2.gain.setValueAtTime(volume * 0.2, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now);
                osc2.stop(now + 0.12);
            } catch (e) {}
        }

        // ============================================================
        // 7. ВИЗУАЛ
        // ============================================================
        function showFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = text;
            el.style.left = (x - 30) + 'px';
            el.style.top = (y - 30) + 'px';
            el.style.fontSize = (24 + state.clickPower * 2) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function showRipple(x, y) {
            const el = document.createElement('div');
            el.className = 'water-ripple';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        // ============================================================
        // 8. ИГРОВАЯ МЕХАНИКА (продолжение)
        // ============================================================
        function addScore(amount, event = null) {
            if (state.score < state.target) {
                state.score += amount;
                state.totalClicks += amount;

                comboCount++;
                clearTimeout(comboTimer);
                comboTimer = setTimeout(() => { comboCount = 0;
                    updateUI(); }, 1200);
                if (comboCount > 20) {
                    const bonus = Math.floor(comboCount / 20);
                    state.score += bonus;
                    state.totalClicks += bonus;
                }

                if (state.score > state.highScore) state.highScore = state.score;
                updateUI();

                if (event) {
                    const text = amount > 1 ? `+${amount}` : '+1';
                    showFloatingText(event.clientX, event.clientY, text);
                    showRipple(event.clientX, event.clientY);
                }
            } else {
                const d = document.getElementById('counterDisplay');
                d.style.transform = 'scale(1.1)';
                setTimeout(() => d.style.transform = 'scale(1)', 150);
            }
        }

        function handleClick(event) {
            const power = state.clickPower + Math.floor(comboCount / 30);
            addScore(power, event);
            playWaterDrop(0.15);
            const d = document.getElementById('counterDisplay');
            d.classList.remove('click-effect');
            void d.offsetWidth;
            d.classList.add('click-effect');
            const btn = document.getElementById('clickBtn');
            btn.style.transform = 'scale(0.92)';
            setTimeout(() => btn.style.transform = 'scale(1)', 100);
        }

        function updateUI() {
            const display = document.getElementById('counterDisplay');
            const progress = document.getElementById('progressFill');
            const targetLabel = document.getElementById('targetLabel');
            const percentLabel = document.getElementById('progressPercent');

            display.textContent = state.score;
            targetLabel.textContent = state.target;
            const pct = Math.min((state.score / state.target) * 100, 100);
            progress.style.width = pct + '%';
            percentLabel.textContent = Math.round(pct) + '%';

            if (state.score >= state.target) {
                display.style.color = '#1dd1a1';
                progress.style.background = 'linear-gradient(90deg, #1dd1a1, #30e5b5)';
            } else {
                display.style.color = '#74b9ff';
                progress.style.background = 'linear-gradient(90deg, #74b9ff, #1dd1a1)';
            }

            document.getElementById('statClicks').textContent = state.totalClicks;
            document.getElementById('statPerClick').textContent = state.clickPower;
            document.getElementById('statPrestige').textContent = state.prestigeLevel;
            document.getElementById('comboCount').textContent = comboCount;

            const pd = document.getElementById('prestigeDisplay');
            pd.innerHTML = state.prestigeLevel > 0 ? `<span class="prestige-badge">🌟 Престиж ${state.prestigeLevel}</span>` : '';

            document.getElementById('priceClick').textContent = priceClick;
            document.getElementById('priceAuto').textContent = priceAuto;

            saveGame();
            document.getElementById('saveStatus').textContent = '✅ Сохранено';
            setTimeout(() => {
                document.getElementById('saveStatus').textContent = '💾 Автосохранение включено';
            }, 2000);
        }

        // ============================================================
        // 9. ПРЕСТИЖ
        // ============================================================
        function doPrestige() {
            if (state.score < state.target) {
                alert(`Достигни цели (${state.target}), чтобы взять престиж!`);
                return;
            }
            if (!confirm(`🌟 Перейти на новый уровень престижа?\nТекущий: ${state.prestigeLevel}\nСчёт сбросится, но ты получишь +1 к силе клика и +50 к цели!`)) return;

            state.prestigeLevel++;
            state.score = 0;
            state.target = 100 + state.prestigeLevel * 50;
            state.clickPower = 1 + state.prestigeLevel;
            if (isAutoRunning) stopAutoClicker();
            comboCount = 0;
            updateUI();
            playWaterDrop(0.3);
        }

        // ============================================================
        // 10. МАГАЗИН
        // ============================================================
        function buyClickPower() {
            if (state.score < priceClick) { alert(`Нужно ${priceClick} очков!`);
                return; }
            state.score -= priceClick;
            state.clickPower++;
            priceClick = Math.floor(priceClick * 1.5) + 2;
            updateUI();
            playWaterDrop(0.15);
        }

        function buyAutoPower() {
            if (state.score < priceAuto) { alert(`Нужно ${priceAuto} очков!`);
                return; }
            state.score -= priceAuto;
            state.autoPower++;
            priceAuto = Math.floor(priceAuto * 1.5) + 3;
            if (isAutoRunning) { stopAutoClicker();
                startAutoClicker(); }
            updateUI();
            playWaterDrop(0.15);
        }

        // ============================================================
        // 11. АВТОКЛИКЕР
        // ============================================================
        function startAutoClicker() {
            if (isAutoRunning) return;
            isAutoRunning = true;
            autoInterval = setInterval(() => {
                if (state.score < state.target) {
                    const amount = state.autoPower + Math.floor(comboCount / 40);
                    state.score += amount;
                    state.totalClicks += amount;
                    if (state.score > state.highScore) state.highScore = state.score;
                    updateUI();
                    if (state.score >= state.target) playWaterDrop(0.25);
                } else {
                    stopAutoClicker();
                }
            }, 500);
            document.getElementById('autoBtn').textContent = '⏸ СТОП';
            document.getElementById('autoBtn').classList.remove('btn-success');
            document.getElementById('autoBtn').classList.add('btn-danger');
        }

        function stopAutoClicker() {
            if (autoInterval) { clearInterval(autoInterval);
                autoInterval = null; }
            isAutoRunning = false;
            document.getElementById('autoBtn').textContent = '▶ АВТО';
            document.getElementById('autoBtn').classList.remove('btn-danger');
            document.getElementById('autoBtn').classList.add('btn-success');
        }

        function toggleAuto() {
            if (isAutoRunning) stopAutoClicker();
            else startAutoClicker();
        }

        // ============================================================
        // 12. ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        const bgColors = ['#0b0f1c', '#1a1f33', '#2d1b33', '#1b2a33', '#331f1b', '#1b3328', '#2a1b33', '#332b1b'];
        let bgIndex = 0;

        function changeBg() { bgIndex = (bgIndex + 1) % bgColors.length;
            document.body.style.background = bgColors[bgIndex]; }

        function increaseTarget() {
            state.target += 50;
            updateUI();
        }

        function resetGame() {
            if (!confirm('Сбросить весь прогресс?')) return;
            if (isAutoRunning) stopAutoClicker();
            localStorage.removeItem('waterClickerSave_' + currentUsername);
            state.score = 0;
            state.totalClicks = 0;
            state.target = 100;
            state.clickPower = 1;
            state.autoPower = 1;
            state.prestigeLevel = 0;
            state.highScore = 0;
            comboCount = 0;
            priceClick = 10;
            priceAuto = 20;
            updateUI();
            settingsMenu.classList.remove('open');
            saveScoreToLeaderboard();
        }

        // ============================================================
        // 13. НАВЕШИВАНИЕ КНОПОК
        // ============================================================
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        document.getElementById('clickBtn').addEventListener('click', handleClick);
        document.getElementById('autoBtn').addEventListener('click', toggleAuto);
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('bgBtn').addEventListener('click', changeBg);
        document.getElementById('targetBtn').addEventListener('click', increaseTarget);
        document.getElementById('prestigeBtn').addEventListener('click', doPrestige);
        document.getElementById('buyClick').addEventListener('click', buyClickPower);
        document.getElementById('buyAuto').addEventListener('click', buyAutoPower);

        // ============================================================
        // 14. МЕНЮ
        // ============================================================
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsMenu = document.getElementById('settingsMenu');

        settingsToggle.addEventListener('click', () => {
            settingsMenu.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!settingsToggle.contains(e.target) && !settingsMenu.contains(e.target)) {
                settingsMenu.classList.remove('open');
            }
        });

        // ============================================================
        // 15. ЗАПУСК
        // ============================================================
        console.log('✅ Water Clicker запущен!');
    </script>

</body>
</html>
