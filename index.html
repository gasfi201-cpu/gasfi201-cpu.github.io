<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кликер с ачивками и звуком 🏆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0f1c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s;
            padding: 20px;
        }
        .container {
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(8px);
            padding: 30px 35px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(233, 69, 96, 0.2);
            max-width: 550px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
            margin-bottom: 5px;
        }
        .sub {
            color: #8888aa;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .score-block {
            background: #0f1424;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
        }
        #counterDisplay {
            font-size: 72px;
            font-weight: 900;
            color: #e94560;
            line-height: 1;
            transition: 0.15s;
            text-shadow: 0 0 30px rgba(233, 69, 96, 0.2);
        }
        .progress-wrap {
            background: #0b0f1c;
            border-radius: 40px;
            height: 12px;
            margin: 15px 0 5px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff6b81);
            border-radius: 40px;
            transition: width 0.2s ease;
        }
        .target-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666688;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #2a2f4a;
            color: white;
            flex: 1 0 auto;
            min-width: 100px;
            box-shadow: 0 4px 0 #0f1424;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0f1424;
        }
        .btn-primary { background: #e94560; box-shadow: 0 4px 0 #aa3348; }
        .btn-primary:hover { background: #ff5a7a; }
        .btn-success { background: #1dd1a1; color: #0b0f1c; box-shadow: 0 4px 0 #0f8b6e; }
        .btn-success:hover { background: #30e5b5; }
        .btn-danger { background: #533483; box-shadow: 0 4px 0 #3a255a; }
        .btn-danger:hover { background: #6a46a0; }
        .btn-warning { background: #f39c12; color: #0b0f1c; box-shadow: 0 4px 0 #b06d0b; }
        .btn-warning:hover { background: #fdcb6e; }

        /* ===== АЧИВКИ ===== */
        .achievements {
            margin-top: 20px;
            background: #0f1424;
            border-radius: 20px;
            padding: 15px 10px;
        }
        .achievements h3 {
            font-size: 14px;
            color: #8888aa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .badge {
            background: #1a1f33;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid #2a2f4a;
            color: #666;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge.unlocked {
            border-color: #fdcb6e;
            color: #fdcb6e;
            background: #2a1f0a;
            box-shadow: 0 0 15px rgba(253, 203, 110, 0.15);
        }
        .badge.unlocked .badge-icon {
            filter: grayscale(0);
        }
        .badge-icon {
            font-size: 16px;
            filter: grayscale(1);
        }
        .badge.unlocked .badge-icon {
            filter: grayscale(0);
        }

        .auto-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            margin-right: 8px;
            transition: 0.3s;
        }
        .auto-indicator.active {
            background: #1dd1a1;
            box-shadow: 0 0 15px #1dd1a1;
        }
        footer {
            margin-top: 15px;
            font-size: 12px;
            color: #444466;
        }
        .click-effect {
            animation: pop 0.15s ease;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #fff; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 КЛИКЕР 3.0</h1>
    <div class="sub">+ звук, + ачивки, + секретный бонус</div>

    <div class="score-block">
        <div id="counterDisplay">0</div>
        <div class="progress-wrap">
            <div id="progressFill"></div>
        </div>
        <div class="target-info">
            <span>Цель: <span id="targetLabel">100</span></span>
            <span id="progressPercent">0%</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="clickBtn">👆 КЛИК!</button>
        <button class="btn btn-success" id="autoBtn">▶ АВТО</button>
        <button class="btn btn-danger" id="resetBtn">🔄 СБРОС</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-warning" id="bgBtn">🎨 ФОН</button>
        <button class="btn" id="targetBtn" style="background:#2d3a5a;">🎯 ЦЕЛЬ +50</button>
    </div>

    <!-- БЛОК АЧИВОК -->
    <div class="achievements" id="achievementBlock">
        <h3>🏅 ДОСТИЖЕНИЯ</h3>
        <div class="badge-list" id="badgeList">
            <div class="badge" id="achFirstClick"><span class="badge-icon">👆</span> Первый клик</div>
            <div class="badge" id="achFifty"><span class="badge-icon">50</span> 50 кликов</div>
            <div class="badge" id="achHundred"><span class="badge-icon">💯</span> 100 кликов</div>
            <div class="badge" id="achTwoHundred"><span class="badge-icon">🔥</span> 200 кликов</div>
            <div class="badge" id="achAuto"><span class="badge-icon">🤖</span> Авто-старт</div>
            <div class="badge" id="achGoal"><span class="badge-icon">🎯</span> Цель достигнута</div>
            <div class="badge" id="achSecret"><span class="badge-icon">🤯</span> Секрет!</div>
        </div>
    </div>

    <footer>
        <span class="auto-indicator" id="autoIndicator"></span>
        <span id="autoStatus">Автокликер выключен</span>
    </footer>
</div>

<script>
    // ============================================================
    // 1. ПЕРЕМЕННЫЕ
    // ============================================================
    let score = 0;
    let target = 100;
    let autoInterval = null;
    let isAutoRunning = false;
    let totalClicks = 0; // для секретной ачивки

    // Состояние ачивок
    const achievements = {
        firstClick: false,
        fifty: false,
        hundred: false,
        twoHundred: false,
        auto: false,
        goal: false,
        secret: false
    };

    // Элементы
    const displayEl = document.getElementById('counterDisplay');
    const progressFill = document.getElementById('progressFill');
    const targetLabel = document.getElementById('targetLabel');
    const progressPercent = document.getElementById('progressPercent');

    const clickBtn = document.getElementById('clickBtn');
    const autoBtn = document.getElementById('autoBtn');
    const resetBtn = document.getElementById('resetBtn');
    const bgBtn = document.getElementById('bgBtn');
    const targetBtn = document.getElementById('targetBtn');

    const autoIndicator = document.getElementById('autoIndicator');
    const autoStatus = document.getElementById('autoStatus');

    // Элементы ачивок
    const achFirstClick = document.getElementById('achFirstClick');
    const achFifty = document.getElementById('achFifty');
    const achHundred = document.getElementById('achHundred');
    const achTwoHundred = document.getElementById('achTwoHundred');
    const achAuto = document.getElementById('achAuto');
    const achGoal = document.getElementById('achGoal');
    const achSecret = document.getElementById('achSecret');

    const bgColors = ['#0b0f1c', '#1a1f33', '#2d1b33', '#1b2a33', '#331f1b', '#1b3328', '#2a1b33', '#332b1b'];

    // ============================================================
    // 2. ЗВУК
    // ============================================================
    function playClickSound() {
        try {
            // Создаём звук через Web Audio API (без внешних файлов)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = 800 + Math.random() * 400; // случайная частота
            oscillator.type = 'sine';
            gainNode.gain.value = 0.1;
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.08);
        } catch(e) {
            // если звук не работает — просто игнорируем
        }
    }

    // ============================================================
    // 3. ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
        displayEl.textContent = score;
        let percent = Math.min((score / target) * 100, 100);
        progressFill.style.width = percent + '%';
        progressPercent.textContent = Math.round(percent) + '%';

        if (score >= target) {
            displayEl.style.color = '#1dd1a1';
            progressFill.style.background = 'linear-gradient(90deg, #1dd1a1, #30e5b5)';
        } else {
            displayEl.style.color = '#e94560';
            progressFill.style.background = 'linear-gradient(90deg, #e94560, #ff6b81)';
        }

        displayEl.classList.remove('click-effect');
        void displayEl.offsetWidth;
        displayEl.classList.add('click-effect');

        checkAchievements();
    }

    // ============================================================
    // 4. АЧИВКИ
    // ============================================================
    function unlockBadge(element) {
        if (!element.classList.contains('unlocked')) {
            element.classList.add('unlocked');
            playClickSound(); // звук при получении ачивки!
        }
    }

    function checkAchievements() {
        if (score >= 1 && !achievements.firstClick) {
            achievements.firstClick = true;
            unlockBadge(achFirstClick);
        }
        if (score >= 50 && !achievements.fifty) {
            achievements.fifty = true;
            unlockBadge(achFifty);
        }
        if (score >= 100 && !achievements.hundred) {
            achievements.hundred = true;
            unlockBadge(achHundred);
        }
        if (score >= 200 && !achievements.twoHundred) {
            achievements.twoHundred = true;
            unlockBadge(achTwoHundred);
        }
        if (score >= target && !achievements.goal) {
            achievements.goal = true;
            unlockBadge(achGoal);
        }
        // Секретная ачивка: набрать 250 кликов
        if (totalClicks >= 250 && !achievements.secret) {
            achievements.secret = true;
            unlockBadge(achSecret);
        }
    }

    function unlockAutoAchievement() {
        if (!achievements.auto) {
            achievements.auto = true;
            unlockBadge(achAuto);
        }
    }

    // ============================================================
    // 5. КЛИК
    // ============================================================
    function handleClick() {
        if (score < target) {
            score++;
            totalClicks++;
            playClickSound();
            updateUI();
        } else {
            displayEl.style.transform = 'scale(1.1)';
            setTimeout(() => { displayEl.style.transform = 'scale(1)'; }, 150);
        }
    }

    // ============================================================
    // 6. СБРОС
    // ============================================================
    function resetGame() {
        if (isAutoRunning) stopAutoClicker();
        score = 0;
        totalClicks = 0;
        achievements.firstClick = false;
        achievements.fifty = false;
        achievements.hundred = false;
        achievements.twoHundred = false;
        achievements.goal = false;
        achievements.secret = false;
        [achFirstClick, achFifty, achHundred, achTwoHundred, achGoal, achSecret].forEach(el => el.classList.remove('unlocked'));
        displayEl.style.color = '#e94560';
        progressFill.style.background = 'linear-gradient(90deg, #e94560, #ff6b81)';
        updateUI();
    }

    // ============================================================
    // 7. АВТОКЛИКЕР
    // ============================================================
    function startAutoClicker() {
        if (isAutoRunning) return;
        isAutoRunning = true;
        autoInterval = setInterval(() => {
            if (score < target) {
                score++;
                totalClicks++;
                updateUI();
            } else {
                stopAutoClicker();
            }
        }, 300);
        autoIndicator.classList.add('active');
        autoStatus.textContent = 'Автокликер включён';
        autoBtn.textContent = '⏸ СТОП';
        unlockAutoAchievement();
    }

    function stopAutoClicker() {
        if (autoInterval) {
            clearInterval(autoInterval);
            autoInterval = null;
        }
        isAutoRunning = false;
        autoIndicator.classList.remove('active');
        autoStatus.textContent = 'Автокликер выключен';
        autoBtn.textContent = '▶ АВТО';
    }

    function toggleAutoClicker() {
        if (isAutoRunning) {
            stopAutoClicker();
        } else {
            startAutoClicker();
        }
    }

    // ============================================================
    // 8. ФОН И ЦЕЛЬ
    // ============================================================
    function changeBackground() {
        document.body.style.background = bgColors[Math.floor(Math.random() * bgColors.length)];
    }

    function increaseTarget() {
        target += 50;
        targetLabel.textContent = target;
        if (score < target && achievements.goal) {
            achievements.goal = false;
            achGoal.classList.remove('unlocked');
        }
        updateUI();
    }

    // ============================================================
    // 9. СОБЫТИЯ
    // ============================================================
    clickBtn.addEventListener('click', handleClick);
    resetBtn.addEventListener('click', resetGame);
    autoBtn.addEventListener('click', toggleAutoClicker);
    bgBtn.addEventListener('click', changeBackground);
    targetBtn.addEventListener('click', increaseTarget);

    // ============================================================
    // 10. СТАРТ
    // ============================================================
    updateUI();
</script>

</body>
</html>
