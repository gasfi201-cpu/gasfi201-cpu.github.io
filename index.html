<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Water Clicker 🫧</title>
    <style>
        /* === ЗАПРЕТ ПРИБЛИЖЕНИЯ === */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: background 0.5s;
        }
        .container {
            background: rgba(20, 30, 60, 0.9);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 40px;
            border: 1px solid rgba(100, 180, 255, 0.3);
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 60px rgba(0, 150, 255, 0.1);
            position: relative;
        }
        .header-buttons {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .header-buttons button {
            background: none;
            border: none;
            color: #667799;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
        }
        .header-buttons button:hover {
            color: #5cb8ff;
        }
        .header-buttons .ach-btn:hover {
            color: #ff6bc4;
        }
        .settings-menu {
            position: absolute;
            top: 55px;
            right: 20px;
            background: #1a2a4a;
            border: 1px solid #2a4a6a;
            border-radius: 16px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            min-width: 170px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .settings-menu.open {
            display: flex;
        }
        .settings-menu .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            background: #2a3a5a;
            color: white;
        }
        .settings-menu .btn-danger { background: #6a2a3a; }
        .settings-menu .btn-danger:hover { background: #8a3a4a; }
        .settings-menu .btn-warning { background: #6a5a2a; }
        .settings-menu .btn-warning:hover { background: #8a7a3a; }
        .settings-menu .btn-success { background: #2a5a3a; }
        .settings-menu .btn-success:hover { background: #3a7a4a; }

        h1 {
            font-size: 36px;
            color: #5cb8ff;
            text-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
        }
        h1 span { color: #ff6b8a; }
        .sub {
            color: #8899bb;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .score-block {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 15px;
        }
        #counterDisplay {
            font-size: 72px;
            font-weight: 900;
            color: #5cb8ff;
            transition: 0.1s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
            font-size: 13px;
            color: #667799;
        }
        .stat-grid span {
            color: #eee;
            font-weight: 700;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
        }
        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #1a2a4a;
            color: white;
            flex: 1 0 auto;
            min-width: 75px;
            box-shadow: 0 4px 0 #0a1220;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a1220;
        }
        .btn-primary {
            background: #5cb8ff;
            color: #0a0a1a;
            box-shadow: 0 4px 0 #2a7ab0;
            font-size: 18px;
        }
        .btn-primary:hover {
            background: #7ac8ff;
        }
        .btn-success {
            background: #00d4a0;
            color: #0a0a1a;
            box-shadow: 0 4px 0 #009a70;
        }
        .btn-success:hover {
            background: #00f0b0;
        }
        .btn-danger {
            background: #ff6b8a;
            color: #0a0a1a;
            box-shadow: 0 4px 0 #b0405a;
        }
        .btn-danger:hover {
            background: #ff88a0;
        }
        .btn-warning {
            background: #ffb84d;
            color: #0a0a1a;
            box-shadow: 0 4px 0 #b08020;
        }
        .btn-warning:hover {
            background: #ffcc66;
        }
        .btn-purple {
            background: #9b6bff;
            color: #0a0a1a;
            box-shadow: 0 4px 0 #6a40b0;
        }
        .btn-purple:hover {
            background: #b088ff;
        }
        .shop-item {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 10px 15px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .shop-item .info {
            text-align: left;
            font-size: 14px;
        }
        .shop-item .info .name {
            font-weight: 700;
            color: #fff;
        }
        .shop-item .info .desc {
            color: #667799;
            font-size: 12px;
        }
        .shop-item .price {
            color: #ffb84d;
            font-weight: 700;
        }
        .shop-item .btn-sm {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            background: #5cb8ff;
            color: #0a0a1a;
        }
        .shop-item .btn-sm:hover {
            background: #7ac8ff;
        }
        .float-text {
            position: fixed;
            pointer-events: none;
            font-weight: 900;
            font-size: 30px;
            color: #5cb8ff;
            text-shadow: 0 0 30px #5cb8ff;
            z-index: 999;
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-150px) scale(1.6);
            }
        }
        .float-text.bonus {
            color: #ffb84d;
            text-shadow: 0 0 30px #ffb84d;
            font-size: 40px;
        }
        .float-text.bad {
            color: #ff6b8a;
            text-shadow: 0 0 30px #ff6b8a;
        }
        .float-text.crit {
            color: #ff2d55;
            text-shadow: 0 0 40px #ff2d55;
            font-size: 50px;
        }
        .float-text.pet {
            color: #f7dc6f;
            text-shadow: 0 0 40px #f7dc6f;
            font-size: 44px;
        }
        .float-text.achievement {
            color: #ff6bc4;
            text-shadow: 0 0 40px #ff6bc4;
            font-size: 36px;
        }
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            animation: particleExplode 0.8s ease-out forwards;
            z-index: 998;
        }
        @keyframes particleExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
        .prestige-badge {
            background: #9b6bff;
            color: #0a0a1a;
            border-radius: 30px;
            padding: 4px 18px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-top: 5px;
        }
        .event-banner {
            background: rgba(255, 184, 77, 0.15);
            border: 1px solid #ffb84d;
            border-radius: 16px;
            padding: 8px 15px;
            margin: 8px 0;
            font-size: 14px;
            color: #ffb84d;
            animation: pulse 1.5s infinite;
        }
        .event-banner.good {
            border-color: #00d4a0;
            color: #00d4a0;
            background: rgba(0, 212, 160, 0.15);
        }
        .event-banner.bad {
            border-color: #ff6b8a;
            color: #ff6b8a;
            background: rgba(255, 107, 138, 0.15);
        }
        .event-banner.pet {
            border-color: #f7dc6f;
            color: #f7dc6f;
            background: rgba(247, 220, 111, 0.2);
            animation: pulse 0.6s infinite;
        }
        .event-banner.achievement {
            border-color: #ff6bc4;
            color: #ff6bc4;
            background: rgba(255, 107, 196, 0.2);
            animation: pulse 0.6s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        .hidden {
            display: none !important;
        }
        footer {
            margin-top: 15px;
            font-size: 12px;
            color: #445566;
        }
        .click-effect {
            animation: pop 0.15s ease;
        }
        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
                color: #fff;
            }
            100% {
                transform: scale(1);
            }
        }

        .pet-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid rgba(247, 220, 111, 0.2);
        }
        .pet-section h3 {
            color: #f7dc6f;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .pet-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .pet-item {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            border: 2px solid #2a3a5a;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pet-item.active {
            border-color: #f7dc6f;
            background: rgba(247, 220, 111, 0.15);
            box-shadow: 0 0 20px rgba(247, 220, 111, 0.2);
        }
        .pet-item .pet-emoji {
            font-size: 20px;
        }
        .pet-item .pet-level {
            color: #667799;
            font-size: 11px;
        }
        .pet-item .pet-bonus {
            color: #00d4a0;
            font-size: 11px;
        }
        .pet-detail {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 10px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pet-detail .info {
            text-align: left;
            font-size: 13px;
        }
        .pet-detail .info .name {
            font-weight: 700;
            color: #f7dc6f;
        }
        .pet-detail .info .desc {
            color: #667799;
            font-size: 12px;
        }
        .pet-detail .btn-sm {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            background: #ffb84d;
            color: #0a0a1a;
        }
        .pet-detail .btn-sm:hover {
            background: #ffcc66;
        }
        .pet-detail .btn-sm.feed {
            background: #00d4a0;
        }
        .pet-detail .btn-sm.feed:hover {
            background: #00f0b0;
        }

        .achievement-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .achievement-overlay.open {
            display: flex;
        }
        .achievement-window {
            background: #1a2a4a;
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 107, 196, 0.3);
            box-shadow: 0 0 60px rgba(255, 107, 196, 0.1);
            position: relative;
        }
        .achievement-window h2 {
            color: #ff6bc4;
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
        }
        .achievement-window .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #667799;
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
        }
        .achievement-window .close-btn:hover {
            color: #ff6b8a;
            transform: rotate(90deg);
        }
        .ach-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .ach-item-window {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2a3a5a;
            color: #667799;
            transition: 0.3s;
        }
        .ach-item-window.unlocked {
            border-color: #ff6bc4;
            color: #ff6bc4;
            background: rgba(255, 107, 196, 0.08);
        }
        .ach-item-window .ach-icon {
            font-size: 20px;
        }
        .ach-item-window .ach-name {
            flex: 1;
            text-align: left;
            margin-left: 10px;
            font-size: 14px;
        }
        .ach-item-window .ach-reward {
            font-size: 12px;
            color: #ffb84d;
            margin-right: 8px;
        }
        .ach-item-window .ach-status {
            font-size: 16px;
        }

        /* === ФИКС ДЛЯ ТЕЛЕФОНА === */
        #clickBtn {
            touch-action: manipulation;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn, .btn-sm, .pet-item, .settings-btn, .ach-btn, #settingsToggle {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-buttons">
            <button class="ach-btn" id="achievementBtn">🏆</button>
            <button id="settingsToggle">⚙️</button>
        </div>
        <div class="settings-menu" id="settingsMenu">
            <button class="btn btn-danger" id="resetBtn">🔄 Сброс прогресса</button>
            <button class="btn btn-warning" id="bgSettingsBtn">🎨 Сменить фон</button>
            <button class="btn btn-success" id="soundToggleBtn">🔊 Звук: Вкл</button>
        </div>

        <h1>🫧 <span>Water</span> Clicker</h1>
        <div class="sub">~ бесконечный фарм капель ~</div>

        <div class="score-block">
            <div id="counterDisplay">0</div>
            <div id="prestigeDisplay"></div>
        </div>

        <div id="eventBanner" class="hidden event-banner"></div>

        <div class="stat-grid">
            <div>💧 Капель: <span id="statClicks">0</span></div>
            <div>⚡ Капель/сек: <span id="statCps">0</span></div>
            <div>🌟 Престиж: <span id="statPrestige">0</span></div>
        </div>

        <div class="pet-section">
            <h3>🐾 ПИТОМЦЫ</h3>
            <div class="pet-list" id="petList"></div>
            <div id="petDetail" class="hidden pet-detail"></div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="clickBtn">💧 КАПНУТЬ!</button>
        </div>
        <div class="btn-group">
            <button class="btn btn-success" id="autoBtn">▶ АВТО</button>
            <button class="btn btn-purple" id="prestigeBtn">🌟 ПРЕСТИЖ</button>
            <button class="btn btn-warning" id="dailyBtn">🎁 ДЕНЬ</button>
        </div>

        <div style="margin:12px 0;">
            <div style="text-align:left;font-size:13px;color:#667799;margin-bottom:6px;">🏪 МАГАЗИН БУСТОВ</div>

            <div class="shop-item">
                <div class="info"><span class="name">⚡ Ускорение клика</span><div class="desc">+1 к силе клика</div></div>
                <div><span class="price" id="priceClick">10 💧</span> <button class="btn-sm" id="buyClick">Купить</button></div>
            </div>

            <div class="shop-item">
                <div class="info"><span class="name">🤖 Авто-капля</span><div class="desc">+1 к автокликеру</div></div>
                <div><span class="price" id="priceAuto">20 💧</span> <button class="btn-sm" id="buyAuto">Купить</button></div>
            </div>

            <div class="shop-item">
                <div class="info"><span class="name">💰 Множитель x2</span><div class="desc">x2 к каплям на 10 сек</div></div>
                <div><span class="price" id="priceBoost">30 💧</span> <button class="btn-sm" id="buyBoost">Купить</button></div>
            </div>
        </div>

        <footer>
            💾 <span id="saveStatus">Автосохранение</span>
        </footer>
    </div>

    <div class="achievement-overlay" id="achievementOverlay">
        <div class="achievement-window">
            <button class="close-btn" id="closeAchievementBtn">✕</button>
            <h2>🏆 ДОСТИЖЕНИЯ</h2>
            <div class="ach-list" id="achievementListWindow"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. СОСТОЯНИЕ
        // ============================================================
        let state = {
            score: 0,
            totalClicks: 0,
            clickPower: 1,
            autoPower: 0,
            prestigeLevel: 0,
            highScore: 0,
            boostActive: false,
            dailyClaimed: false,
            dailyDate: '',
            pets: [],
            activePetId: null,
            nextPetThreshold: 1000000,
            achievements: {
                firstDrop: false,
                fiftyDrops: false,
                hundredDrops: false,
                thousandDrops: false,
                millionDrops: false,
                tenMillionDrops: false,
                combo10: false,
                combo50: false,
                prestige1: false,
                prestige5: false,
                petCollector: false,
                autoOn: false,
                clickPower10: false
            }
        };

        const PET_TYPES = [
            { id: 'fish', emoji: '🐠', name: 'Рыбка', bonus: 0.4, feedCost: 100 },
            { id: 'frog', emoji: '🐸', name: 'Лягушка', bonus: 0.8, feedCost: 250 },
            { id: 'turtle', emoji: '🐢', name: 'Черепаха', bonus: 1.5, feedCost: 500 },
            { id: 'dolphin', emoji: '🐬', name: 'Дельфин', bonus: 3, feedCost: 1000 },
            { id: 'whale', emoji: '🐳', name: 'Кит', bonus: 6, feedCost: 2500 },
            { id: 'dragon', emoji: '🐉', name: 'Дракон', bonus: 12, feedCost: 5000 },
            { id: 'phoenix', emoji: '🔥', name: 'Феникс', bonus: 25, feedCost: 10000 }
        ];

        const ACHIEVEMENTS = [
            { id: 'firstDrop', name: 'Первая капля', icon: '💧', reward: '+10💧', rewardFn: () => { state.score += 10; },
                check: () => state.totalClicks >= 1 },
            { id: 'fiftyDrops', name: '50 капель', icon: '💧', reward: '+50💧', rewardFn: () => { state.score += 50; },
                check: () => state.totalClicks >= 50 },
            { id: 'hundredDrops', name: '100 капель', icon: '💧', reward: '+100💧', rewardFn: () => { state.score += 100; },
                check: () => state.totalClicks >= 100 },
            { id: 'thousandDrops', name: '1000 капель', icon: '💧', reward: '+500💧', rewardFn: () => { state.score += 500; },
                check: () => state.totalClicks >= 1000 },
            { id: 'millionDrops', name: '1 000 000 капель!', icon: '💎', reward: '+1💪',
                rewardFn: () => { state.clickPower += 1; }, check: () => state.totalClicks >= 1000000 },
            { id: 'tenMillionDrops', name: '10 000 000 капель!', icon: '👑', reward: '+2💪',
                rewardFn: () => { state.clickPower += 2; }, check: () => state.totalClicks >= 10000000 },
            { id: 'combo10', name: 'Комбо x10', icon: '🔥', reward: '+100💧', rewardFn: () => { state.score += 100; },
                check: () => comboCount >= 10 },
            { id: 'combo50', name: 'Комбо x50', icon: '🔥', reward: '+500💧', rewardFn: () => { state.score += 500; },
                check: () => comboCount >= 50 },
            { id: 'prestige1', name: 'Первый престиж', icon: '🌟', reward: '+2💪',
                rewardFn: () => { state.clickPower += 2; }, check: () => state.prestigeLevel >= 1 },
            { id: 'prestige5', name: '5 престижей', icon: '🌟', reward: '+5💪',
                rewardFn: () => { state.clickPower += 5; }, check: () => state.prestigeLevel >= 5 },
            { id: 'petCollector', name: 'Коллекционер', icon: '🐾', reward: '+3💪',
                rewardFn: () => { state.clickPower += 3; }, check: () => state.pets.length >= 3 },
            { id: 'autoOn', name: 'Автоматизация', icon: '🤖', reward: '+2💪',
                rewardFn: () => { state.clickPower += 2; }, check: () => isAutoRunning === true },
            { id: 'clickPower10', name: 'Сила 10+', icon: '💪', reward: '+1000💧',
                rewardFn: () => { state.score += 1000; }, check: () => state.clickPower >= 10 }
        ];

        let autoInterval = null;
        let isAutoRunning = false;
        let priceClick = 10;
        let priceAuto = 20;
        let priceBoost = 30;
        let comboCount = 0;
        let comboTimer = null;
        let clickHistory = [];
        let cps = 0;
        let soundEnabled = true;
        let boostTimer = null;

        // ============================================================
        // 2. ЗАГРУЗКА / СОХРАНЕНИЕ
        // ============================================================
        function loadGame() {
            const saved = localStorage.getItem('waterClickerSave');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    state.score = data.score || 0;
                    state.totalClicks = data.totalClicks || 0;
                    state.clickPower = data.clickPower || 1;
                    state.autoPower = data.autoPower || 0;
                    state.prestigeLevel = data.prestigeLevel || 0;
                    state.highScore = data.highScore || 0;
                    state.dailyClaimed = data.dailyClaimed || false;
                    state.dailyDate = data.dailyDate || '';
                    state.pets = data.pets || [];
                    state.activePetId = data.activePetId || null;
                    state.nextPetThreshold = data.nextPetThreshold || 1000000;
                    state.achievements = data.achievements || state.achievements;
                    priceClick = data.priceClick || 10;
                    priceAuto = data.priceAuto || 20;
                    priceBoost = data.priceBoost || 30;
                } catch (e) {}
            }
            checkDailyBonus();
            checkPetUnlock();
            updateUI();
        }

        function saveGame() {
            const data = {
                score: state.score,
                totalClicks: state.totalClicks,
                clickPower: state.clickPower,
                autoPower: state.autoPower,
                prestigeLevel: state.prestigeLevel,
                highScore: state.highScore,
                dailyClaimed: state.dailyClaimed,
                dailyDate: state.dailyDate,
                pets: state.pets,
                activePetId: state.activePetId,
                nextPetThreshold: state.nextPetThreshold,
                achievements: state.achievements,
                priceClick: priceClick,
                priceAuto: priceAuto,
                priceBoost: priceBoost
            };
            localStorage.setItem('waterClickerSave', JSON.stringify(data));
        }

        // ============================================================
        // 3. ДОСТИЖЕНИЯ
        // ============================================================
        function renderAchievementsWindow() {
            const list = document.getElementById('achievementListWindow');
            let html = '';
            ACHIEVEMENTS.forEach(a => {
                const unlocked = state.achievements[a.id] || false;
                html += `<div class="ach-item-window ${unlocked ? 'unlocked' : ''}">
                            <span class="ach-icon">${a.icon}</span>
                            <span class="ach-name">${a.name}</span>
                            <span class="ach-reward">${unlocked ? '✅ ' + a.reward : '🔒 ' + a.reward}</span>
                            <span class="ach-status">${unlocked ? '✅' : '🔒'}</span>
                        </div>`;
            });
            list.innerHTML = html;
        }

        function checkAchievements() {
            let unlocked = false;
            ACHIEVEMENTS.forEach(a => {
                if (!state.achievements[a.id] && a.check()) {
                    state.achievements[a.id] = true;
                    unlocked = true;
                    if (a.rewardFn) a.rewardFn();
                    showEvent(`🏆 Достижение: ${a.icon} ${a.name}! Награда: ${a.reward}`, 'achievement');
                    spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 30, '#ff6bc4');
                    showFloatingText(window.innerWidth / 2 - 60, window.innerHeight / 2 - 80,
                        `${a.icon} ${a.name} +${a.reward}`, 'achievement');
                    saveGame();
                    updateUI();
                }
            });
            if (unlocked) {
                renderAchievementsWindow();
            }
        }

        // ============================================================
        // 4. ПИТОМЦЫ
        // ============================================================
        function checkPetUnlock() {
            while (state.totalClicks >= state.nextPetThreshold) {
                const petIndex = state.pets.length;
                if (petIndex >= PET_TYPES.length) break;
                const petType = PET_TYPES[petIndex];
                state.pets.push({
                    id: petType.id,
                    level: 1,
                    exp: 0,
                    hunger: 100,
                    emoji: petType.emoji,
                    name: petType.name,
                    bonus: petType.bonus,
                    feedCost: petType.feedCost
                });
                if (!state.activePetId) state.activePetId = petType.id;
                state.nextPetThreshold += 1000000;
                showEvent(`🐾 Новый питомец: ${petType.emoji} ${petType.name}!`, 'pet');
                spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 40, '#f7dc6f');
                showFloatingText(window.innerWidth / 2 - 80, window.innerHeight / 2 - 100, `${petType.emoji} ${petType.name}`,
                    'pet');
                saveGame();
            }
            renderPets();
        }

        function renderPets() {
            const list = document.getElementById('petList');
            if (state.pets.length === 0) {
                list.innerHTML = '<div style="color:#667799;font-size:13px;">Нет питомцев. Набери 1 000 000 капель!</div>';
                document.getElementById('petDetail').classList.add('hidden');
                return;
            }
            let html = '';
            state.pets.forEach(p => {
                const isActive = state.activePetId === p.id;
                const levelBonus = (p.bonus * p.level).toFixed(1);
                html += `<div class="pet-item ${isActive ? 'active' : ''}" data-id="${p.id}">
                            <span class="pet-emoji">${p.emoji}</span>
                            <span>${p.name}</span>
                            <span class="pet-level">Lv${p.level}</span>
                            <span class="pet-bonus">+${levelBonus}</span>
                        </div>`;
            });
            list.innerHTML = html;

            document.querySelectorAll('.pet-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    selectPet(id);
                });
            });

            if (state.activePetId) {
                const pet = state.pets.find(p => p.id === state.activePetId);
                if (pet) showPetDetail(pet);
            }
        }

        function selectPet(id) {
            state.activePetId = id;
            saveGame();
            renderPets();
            const pet = state.pets.find(p => p.id === id);
            if (pet) showPetDetail(pet);
            showEvent(`🐾 Выбран ${pet.emoji} ${pet.name}`, 'good');
        }

        function showPetDetail(pet) {
            const detail = document.getElementById('petDetail');
            detail.classList.remove('hidden');
            const levelBonus = (pet.bonus * pet.level).toFixed(1);
            const hungerBar = pet.hunger > 70 ? '😊' : pet.hunger > 40 ? '😐' : '😫';
            detail.innerHTML = `
                        <div class="info">
                            <span class="name">${pet.emoji} ${pet.name}</span>
                            <div class="desc">Уровень ${pet.level} | Бонус: +${levelBonus} к силе</div>
                            <div class="desc">Голод: ${Math.round(pet.hunger)}% ${hungerBar}</div>
                            <div class="desc">До след. уровня: ${Math.floor(100 - pet.exp)}%</div>
                        </div>
                        <div>
                            <button class="btn-sm feed" id="feedPetBtn">🍖 Кормить (${pet.feedCost} 💧)</button>
                        </div>
                    `;
            document.getElementById('feedPetBtn').addEventListener('click', () => feedPet(pet.id));
        }

        function feedPet(id) {
            const pet = state.pets.find(p => p.id === id);
            if (!pet) return;
            if (state.score < pet.feedCost) {
                showEvent(`🍖 Не хватает ${pet.feedCost} капель!`, 'bad');
                return;
            }
            state.score -= pet.feedCost;
            pet.hunger = Math.min(100, pet.hunger + 20);
            pet.exp += 15;
            if (pet.exp >= 100) {
                pet.exp = 0;
                pet.level++;
                pet.feedCost = Math.floor(pet.feedCost * 1.5) + 10;
                showEvent(`🎉 ${pet.emoji} ${pet.name} достиг ${pet.level} уровня!`, 'good');
                spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 30, '#f7dc6f');
            }
            saveGame();
            updateUI();
            renderPets();
            playWaterDrop();
            showEvent(`🍖 ${pet.emoji} ${pet.name} покормлен!`, 'good');
        }

        function getPetBonus() {
            if (!state.activePetId) return 0;
            const pet = state.pets.find(p => p.id === state.activePetId);
            if (!pet) return 0;
            const hungerPenalty = Math.max(0, (100 - pet.hunger) / 100 * 0.5);
            return pet.bonus * pet.level * (1 - hungerPenalty);
        }

        // ============================================================
        // 5. ЕЖЕДНЕВНЫЙ БОНУС
        // ============================================================
        function checkDailyBonus() {
            const today = new Date().toDateString();
            if (state.dailyDate !== today) {
                state.dailyClaimed = false;
                state.dailyDate = today;
                document.getElementById('dailyBtn').textContent = '🎁 ДЕНЬ';
                document.getElementById('dailyBtn').classList.remove('btn-danger');
                document.getElementById('dailyBtn').classList.add('btn-warning');
            } else if (state.dailyClaimed) {
                document.getElementById('dailyBtn').textContent = '✅ ДЕНЬ';
                document.getElementById('dailyBtn').classList.remove('btn-warning');
                document.getElementById('dailyBtn').classList.add('btn-success');
            }
        }

        function claimDailyBonus() {
            if (state.dailyClaimed) {
                showEvent('⏰ Бонус уже получен сегодня!', 'bad');
                return;
            }
            const bonus = 50 + state.prestigeLevel * 10;
            state.score += bonus;
            state.totalClicks += bonus;
            state.dailyClaimed = true;
            state.dailyDate = new Date().toDateString();
            saveGame();
            updateUI();
            showEvent(`🎁 Ежедневный бонус: +${bonus} капель!`, 'good');
            spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 30, '#ffb84d');
            document.getElementById('dailyBtn').textContent = '✅ ДЕНЬ';
            document.getElementById('dailyBtn').classList.remove('btn-warning');
            document.getElementById('dailyBtn').classList.add('btn-success');
        }

        // ============================================================
        // 6. ЗВУК
        // ============================================================
        function playWaterDrop() {
            if (!soundEnabled) return;
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500 + Math.random() * 200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200 + Math.random() * 100, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) {}
        }

        // ============================================================
        // 7. ВИЗУАЛ
        // ============================================================
        function showFloatingText(x, y, text, type = 'normal') {
            const el = document.createElement('div');
            el.className = 'float-text';
            if (type === 'bonus') el.classList.add('bonus');
            if (type === 'bad') el.classList.add('bad');
            if (type === 'crit') el.classList.add('crit');
            if (type === 'pet') el.classList.add('pet');
            if (type === 'achievement') el.classList.add('achievement');
            el.textContent = text;
            el.style.left = (x - 30) + 'px';
            el.style.top = (y - 30) + 'px';
            el.style.fontSize = (24 + state.clickPower * 2) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        function spawnParticles(x, y, count = 12, color = null) {
            const colors = ['#5cb8ff', '#00d4a0', '#ffb84d', '#ff6b8a', '#9b6bff'];
            if (color) {
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 4 + Math.random() * 8;
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 60 + Math.random() * 100;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.background = color;
                    p.style.left = x + 'px';
                    p.style.top = y + 'px';
                    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 800);
                }
                return;
            }
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 4 + Math.random() * 8;
                const angle = Math.random() * 2 * Math.PI;
                const dist = 60 + Math.random() * 100;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function showEvent(text, type = 'good') {
            const banner = document.getElementById('eventBanner');
            banner.textContent = text;
            banner.className = 'event-banner ' + type;
            banner.classList.remove('hidden');
            clearTimeout(banner._timer);
            banner._timer = setTimeout(() => banner.classList.add('hidden'), 3500);
        }

        // ============================================================
        // 8. ПРЕСТИЖ
        // ============================================================
        function getPrestigeCost() {
            if (state.prestigeLevel === 0) return 50;
            return 50 * Math.pow(2, state.prestigeLevel);
        }

        // ============================================================
        // 9. ИГРОВАЯ МЕХАНИКА
        // ============================================================
        function getMultiplier() {
            let mult = 1;
            if (state.boostActive) mult *= 2;
            return mult;
        }

        function addScore(amount, event = null) {
            const petBonus = getPetBonus();
            const totalPower = state.clickPower + petBonus + Math.floor(comboCount / 20);
            let finalAmount = totalPower * getMultiplier();
            let isCrit = false;

            if (Math.random() < 0.05) {
                finalAmount *= 4;
                isCrit = true;
            }

            state.score += finalAmount;
            state.totalClicks += amount || totalPower;

            state.pets.forEach(p => {
                p.hunger = Math.max(0, p.hunger - 0.02);
            });

            comboCount++;
            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => { comboCount = 0;
                updateUI(); }, 1500);

            if (comboCount > 0 && comboCount % 10 === 0) {
                const bonus = Math.floor(comboCount / 6);
                state.score += bonus;
                state.totalClicks += bonus;
                if (event) showFloatingText(event.clientX - 40, event.clientY - 80, `🔥 +${bonus} комбо!`, 'bonus');
                spawnParticles(event.clientX, event.clientY, 20);
            }

            if (state.score > state.highScore) state.highScore = state.score;

            if (Math.random() < 0.015 && event) {
                const bonus = Math.floor(state.totalClicks * 0.01) + 10;
                state.score += bonus;
                state.totalClicks += bonus;
                showEvent(`🎉 Событие! +${bonus} капель!`, 'good');
                spawnParticles(event.clientX, event.clientY, 25);
            }

            checkPetUnlock();
            checkAchievements();

            updateUI();

            if (event) {
                let text = totalPower > 1 ? `+${Math.floor(finalAmount)}` : '+1';
                if (getMultiplier() > 1) text += ' x2!';
                if (isCrit) text = '💥 КРИТ! +' + Math.floor(finalAmount);
                showFloatingText(event.clientX, event.clientY, text, isCrit ? 'crit' : 'normal');
                spawnParticles(event.clientX, event.clientY, isCrit ? 20 : 6);
            }
        }

        function handleClick(event) {
            addScore(1, event);
            playWaterDrop();

            const d = document.getElementById('counterDisplay');
            d.classList.remove('click-effect');
            void d.offsetWidth;
            d.classList.add('click-effect');

            const btn = document.getElementById('clickBtn');
            btn.style.transform = 'scale(0.92)';
            setTimeout(() => btn.style.transform = 'scale(1)', 100);

            if (state.activePetId) {
                const pet = state.pets.find(p => p.id === state.activePetId);
                if (pet) showPetDetail(pet);
            }
        }

        function updateUI() {
            const display = document.getElementById('counterDisplay');
            display.textContent = Math.floor(state.score);

            document.getElementById('statClicks').textContent = state.totalClicks;
            document.getElementById('statPrestige').textContent = state.prestigeLevel;

            const now = Date.now();
            clickHistory = clickHistory.filter(t => now - t < 1000);
            cps = clickHistory.length;
            document.getElementById('statCps').textContent = cps + (isAutoRunning ? '+' + state.autoPower : '');

            const pd = document.getElementById('prestigeDisplay');
            let badgeText = state.prestigeLevel > 0 ? `🌟 Престиж ${state.prestigeLevel}` : '';
            const petBonus = getPetBonus();
            if (petBonus > 0) badgeText += ` 🐾 +${petBonus.toFixed(1)}`;
            const cost = getPrestigeCost();
            badgeText += ` | 🎯 Престиж: ${cost} 💧`;
            pd.innerHTML = badgeText ? `<span class="prestige-badge">${badgeText}</span>` : '';

            document.getElementById('priceClick').textContent = priceClick;
            document.getElementById('priceAuto').textContent = priceAuto;
            document.getElementById('priceBoost').textContent = priceBoost;

            saveGame();
            document.getElementById('saveStatus').textContent = '✅ Сохранено';
            setTimeout(() => {
                document.getElementById('saveStatus').textContent = '💾 Автосохранение';
            }, 2000);
        }

        // ============================================================
        // 10. ПРЕСТИЖ
        // ============================================================
        function doPrestige() {
            const cost = getPrestigeCost();
            if (state.score < cost) {
                alert(`Нужно ${cost} капель для престижа!`);
                return;
            }
            if (!confirm(`🌟 Перейти на новый уровень престижа?\nТекущий: ${state.prestigeLevel}\nНужно: ${cost} капель\nСчёт сбросится, но ты получишь +1 к силе клика!`)) return;

            state.prestigeLevel++;
            state.score = 0;
            state.clickPower = 1 + state.prestigeLevel;
            if (isAutoRunning) stopAutoClicker();
            comboCount = 0;
            updateUI();
            playWaterDrop();
            showEvent(`🌟 Престиж ${state.prestigeLevel}! +1 к силе!`, 'good');
            spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 50);
            checkAchievements();
        }

        // ============================================================
        // 11. МАГАЗИН
        // ============================================================
        function buyClickPower() {
            if (state.score < priceClick) { alert(`Нужно ${priceClick} капель!`);
                return; }
            state.score -= priceClick;
            state.clickPower++;
            priceClick = Math.floor(priceClick * 1.7) + 5;
            updateUI();
            playWaterDrop();
            showEvent(`⚡ Сила клика: ${state.clickPower}`, 'good');
            spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 15);
        }

        function buyAutoPower() {
            if (state.score < priceAuto) { alert(`Нужно ${priceAuto} капель!`);
                return; }
            state.score -= priceAuto;
            state.autoPower++;
            priceAuto = Math.floor(priceAuto * 1.7) + 8;
            if (isAutoRunning) { stopAutoClicker();
                startAutoClicker(); }
            updateUI();
            playWaterDrop();
            showEvent(`🤖 Авто-капля: ${state.autoPower}`, 'good');
            spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 15);
        }

        function buyBoost() {
            if (state.score < priceBoost) { alert(`Нужно ${priceBoost} капель!`);
                return; }
            if (state.boostActive) { alert('Множитель уже активен!'); return; }
            state.score -= priceBoost;
            state.boostActive = true;
            priceBoost = Math.floor(priceBoost * 1.9) + 10;
            updateUI();
            playWaterDrop();
            showEvent(`💰 x2 активирован на 10 секунд!`, 'good');
            spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 30);

            clearTimeout(boostTimer);
            boostTimer = setTimeout(() => {
                state.boostActive = false;
                updateUI();
                showEvent(`⏰ x2 закончился`, 'bad');
            }, 10000);
        }

        // ============================================================
        // 12. АВТОКЛИКЕР
        // ============================================================
        function startAutoClicker() {
            if (isAutoRunning) return;
            isAutoRunning = true;
            autoInterval = setInterval(() => {
                const petBonus = getPetBonus();
                const totalPower = state.autoPower + petBonus + Math.floor(comboCount / 50);
                const amount = totalPower * getMultiplier();
                state.score += amount;
                state.totalClicks += totalPower;
                if (state.score > state.highScore) state.highScore = state.score;
                state.pets.forEach(p => {
                    p.hunger = Math.max(0, p.hunger - 0.01);
                });
                checkPetUnlock();
                checkAchievements();
                updateUI();
            }, 1000);
            document.getElementById('autoBtn').textContent = '⏸ СТОП';
            document.getElementById('autoBtn').classList.remove('btn-success');
            document.getElementById('autoBtn').classList.add('btn-danger');
            checkAchievements();
        }

        function stopAutoClicker() {
            if (autoInterval) { clearInterval(autoInterval);
                autoInterval = null; }
            isAutoRunning = false;
            document.getElementById('autoBtn').textContent = '▶ АВТО';
            document.getElementById('autoBtn').classList.remove('btn-danger');
            document.getElementById('autoBtn').classList.add('btn-success');
        }

        function toggleAuto() {
            if (isAutoRunning) stopAutoClicker();
            else startAutoClicker();
        }

        // ============================================================
        // 13. НАСТРОЙКИ
        // ============================================================
        const bgColors = ['#0a0a1a', '#0d1b2a', '#1a0a1a', '#0a1a1a', '#1a1a0a', '#0a0a2a', '#1a0a2a', '#0a2a1a'];
        let bgIndex = 0;

        function changeBg() {
            bgIndex = (bgIndex + 1) % bgColors.length;
            document.body.style.background = bgColors[bgIndex];
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊 Звук: Вкл' : '🔇 Звук: Выкл';
            if (soundEnabled) playWaterDrop();
        }

        function resetGame() {
            if (!confirm('Сбросить весь прогресс?')) return;
            if (isAutoRunning) stopAutoClicker();
            localStorage.removeItem('waterClickerSave');
            location.reload();
        }

        // ============================================================
        // 14. МЕНЮ
        // ============================================================
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsMenu = document.getElementById('settingsMenu');

        settingsToggle.addEventListener('click', () => {
            settingsMenu.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!settingsToggle.contains(e.target) && !settingsMenu.contains(e.target)) {
                settingsMenu.classList.remove('open');
            }
        });

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('bgSettingsBtn').addEventListener('click', changeBg);
        document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);

        document.getElementById('achievementBtn').addEventListener('click', () => {
            const overlay = document.getElementById('achievementOverlay');
            overlay.classList.toggle('open');
            renderAchievementsWindow();
        });
        document.getElementById('closeAchievementBtn').addEventListener('click', () => {
            document.getElementById('achievementOverlay').classList.remove('open');
        });
        document.getElementById('achievementOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('achievementOverlay').classList.remove('open');
            }
        });

        // ============================================================
        // 15. НАВЕШИВАНИЕ КНОПОК
        // ============================================================
        document.getElementById('clickBtn').addEventListener('click', handleClick);
        document.getElementById('autoBtn').addEventListener('click', toggleAuto);
        document.getElementById('prestigeBtn').addEventListener('click', doPrestige);
        document.getElementById('dailyBtn').addEventListener('click', claimDailyBonus);
        document.getElementById('buyClick').addEventListener('click', buyClickPower);
        document.getElementById('buyAuto').addEventListener('click', buyAutoPower);
        document.getElementById('buyBoost').addEventListener('click', buyBoost);

        // ============================================================
        // 16. ЗАПУСК
        // ============================================================
        loadGame();
        renderPets();
        renderAchievementsWindow();
