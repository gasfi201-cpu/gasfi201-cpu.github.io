<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой стильный сайт</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #2c3e50;
            font-size: 40px;
            border-bottom: 3px solid #3498db;
            display: inline-block;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            margin: 5px auto;
            max-width: 300px;
            border-radius: 20px;
        }
        img {
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin: 20px 0;
            transition: 0.3s;
            width: 300px;
        }
        /* МАГИЯ: при наведении на картинку */
        img:hover {
            background-color: #ffeaa7;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        a {
            color: #e74c3c;
            font-weight: bold;
            text-decoration: none;
            font-size: 18px;
        }
        a:hover {
            text-decoration: underline;
            color: #c0392b;
        }
    </style>
</head>
